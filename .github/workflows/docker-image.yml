name: Docker CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Добавьте это если нужны дополнительные ресурсы
    # strategy:
    #   matrix:
    #     service: ["core-agent-service", "spec-parser-service", "code-generator-service"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check repository structure
      run: |
        echo "Структура репозитория:"
        find . -type f -name "Dockerfile" | head -20
        echo -e "\nОсновные директории:"
        ls -la
        echo -e "\nBackend директории:"
        ls -la backend/ || echo "backend не найден"
        echo -e "\nFrontend директории:"
        ls -la frontend/ || echo "frontend не найден"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build individual services (опционально)
      run: |
        # Проверяем и собираем каждый сервис отдельно для отладки
        echo "Проверяем Dockerfile в каждом сервисе:"
        
        # Core Agent Service
        if [ -f "backend/core_agent_service/Dockerfile" ]; then
          echo "Building core_agent_service..."
          docker build -t core-agent-service:test ./backend/core_agent_service
        else
          echo "⚠️ Dockerfile not found in backend/core_agent_service/"
        fi
        
        # Spec Parser Service
        if [ -f "backend/spec_parser_service/Dockerfile" ]; then
          echo "Building spec_parser_service..."
          docker build -t spec-parser-service:test ./backend/spec_parser_service
        fi
        
        # Code Generator Service
        if [ -f "backend/code_generator_service/Dockerfile" ]; then
          echo "Building code_generator_service..."
          docker build -t code-generator-service:test ./backend/code_generator_service
        fi
        
        # Frontend Dashboard
        if [ -f "frontend/dashboard/Dockerfile" ]; then
          echo "Building frontend dashboard..."
          docker build -t frontend-dashboard:test ./frontend/dashboard
        fi
        
        echo "Список собранных образов:"
        docker images --filter "reference=*:test"
    
    - name: Start with Docker Compose
      run: |
        # Создаем .env файлы если их нет (для тестов)
        echo "Создаем тестовые .env файлы если отсутствуют..."
        
        # Для core_agent_service
        if [ ! -f "backend/core_agent_service/.env" ]; then
          echo "Создаем .env для core_agent_service"
          cat > backend/core_agent_service/.env << EOF
POSTGRES_URL=postgresql://testops:testops_password@postgres:5432/testops_db
REDIS_URL=redis://redis:6379/0
CELERY_BROKER_URL=redis://redis:6379/0
CELERY_RESULT_BACKEND=redis://redis:6379/0
CLOUD_RU_LLM_API_KEY=test-key
EOF
        fi
        
        # Для integration_gateway
        if [ ! -f "backend/integration_gateway/.env" ]; then
          echo "Создаем .env для integration_gateway"
          cat > backend/integration_gateway/.env << EOF
CORE_AGENT_URL=http://core-agent-service:8000
SPEC_PARSER_URL=http://spec-parser-service:8000
CODE_GENERATOR_URL=http://code-generator-service:8000
TEST_OPTIMIZER_URL=http://test-optimizer-service:8000
GITLAB_INTEGRATION_URL=http://gitlab-integration-service:8000
API_KEY=testops-copilot-api-key-2024
EOF
        fi
        
        # Для frontend/dashboard
        if [ ! -f "frontend/dashboard/.env" ]; then
          echo "Создаем .env для frontend/dashboard"
          cat > frontend/dashboard/.env << EOF
VITE_API_URL=http://localhost:8000
VITE_API_KEY=testops-copilot-api-key-2024
EOF
        fi
        
        echo "Запускаем docker-compose сборку..."
        # Только сборка без запуска (build)
        docker-compose build
        
        echo "Запускаем сервисы в фоне..."
        # Запускаем только базы данных и один сервис для теста
        docker-compose up -d postgres redis
        
        echo "Ждем готовности Postgres..."
        sleep 10
        
        # Запускаем один из сервисов для проверки
        docker-compose up -d core-agent-service
        
        echo "Проверяем состояние контейнеров..."
        docker-compose ps
        
        echo "Логи core-agent-service:"
        docker-compose logs --tail=20 core-agent-service || true
        
        # Проверяем доступность сервиса
        echo "Проверка доступности core-agent-service..."
        sleep 15
        curl -f http://localhost:8001/health || curl -f http://localhost:8001/docs || \
          echo "Сервис не ответил, но это может быть нормально на данном этапе"
        
    - name: Health checks (опционально)
      run: |
        # Проверяем доступность PostgreSQL
        echo "Проверка PostgreSQL..."
        docker-compose exec -T postgres pg_isready -U testops || echo "PostgreSQL check failed"
        
        echo "Проверка Redis..."
        docker-compose exec -T redis redis-cli ping || echo "Redis check failed"
        
        echo "Итоговый список контейнеров:"
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        
    - name: Cleanup
      if: always()
      run: |
        echo "Останавливаем контейнеры..."
        docker-compose down -v || true
        echo "Очищаем ненужные образы..."
        docker system prune -f || true
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: |
          /tmp/docker-compose.log
        retention-days: 7
